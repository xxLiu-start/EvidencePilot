global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/inference-alerts.yml
scrape_configs:
  - job_name: evidencepilot-api
    static_configs:
      - targets: ["api:8000"]
  - job_name: evidencepilot-inference
    scheme: https
    authorization:
      type: Bearer
      credentials_file: /run/secrets/inference_metrics_token
    tls_config:
      ca_file: /run/secrets/inference_ca
      server_name: inference
    static_configs:
      - targets: ["inference:8000"]
