name: security acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-keycloak-browser-sso:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-frontend.txt
      - name: Install application and browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-runtime.txt -r requirements-frontend.txt playwright
          python -m playwright install --with-deps chromium
      - name: Real Keycloak and browser acceptance
        run: python -m scripts.security_sso_e2e

  security-scans:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-frontend.txt
      - name: Install runtime and security scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-runtime.txt -r requirements-frontend.txt bandit pip-audit
      - name: Static security scan
        run: |
          mkdir -p security-results
          bandit -r app frontend -ll -ii -f json -o security-results/bandit.json
      - name: Installed dependency vulnerability scan
        if: always()
        run: |
          mkdir -p security-results
          pip-audit --format json --output security-results/pip-audit.json
      - name: Upload security findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-findings
          path: security-results/
          if-no-files-found: error
