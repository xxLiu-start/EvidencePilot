name: official BGE-M3 model evaluation

on:
  pull_request:
    paths:
      - "scripts/prepare_bge_m3_bundles.py"
      - "scripts/model_acceptance.py"
      - "scripts/export_miracl.py"
      - "scripts/retrieval_quality_benchmark.py"
      - "app/retrieval/**"
      - "app/config.py"
      - "requirements-inference.txt"
      - ".github/workflows/bge-m3-model-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bge-m3-evaluation-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  official-model-and-miracl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-inference.txt
      - name: Install CPU inference and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-inference.txt datasets jieba rank-bm25
      - name: Prepare pinned official model bundles
        run: |
          mkdir -p reports/bge_m3
          python -m scripts.prepare_bge_m3_bundles --output "$RUNNER_TEMP/evidencepilot-models" > "$RUNNER_TEMP/model-bundles.json"
          cp "$RUNNER_TEMP/model-bundles.json" reports/bge_m3/model-bundles.json
          python - <<'PY'
          import json, os
          data = json.load(open(os.environ["RUNNER_TEMP"] + "/model-bundles.json"))
          values = {
              "DATABASE_URL": "sqlite://",
              "ENVIRONMENT": "production",
              "INFERENCE_MODE": "local",
              "EMBEDDING_MODEL": data["embedding_path"],
              "EMBEDDING_REVISION": data["embedding_revision"],
              "EMBEDDING_MANIFEST_SHA256": data["embedding_manifest_sha256"],
              "EMBEDDING_LOCAL_FILES_ONLY": "true",
              "RERANKER_MODEL": data["reranker_path"],
              "RERANKER_REVISION": data["reranker_revision"],
              "RERANKER_MANIFEST_SHA256": data["reranker_manifest_sha256"],
              "RERANKER_LOCAL_FILES_ONLY": "true",
              "HF_HUB_OFFLINE": "1",
              "TRANSFORMERS_OFFLINE": "1",
              "OMP_NUM_THREADS": "4",
          }
          with open(os.environ["GITHUB_ENV"], "a") as f:
              for key, value in values.items():
                  f.write(f"{key}={value}\n")
          PY
      - name: Verify actual BGE-M3 and separate reranker inference
        run: python -m scripts.model_acceptance | tee reports/bge_m3/model-smoke.log
      - name: Export official MIRACL English development candidate pool
        env:
          HF_HUB_OFFLINE: "0"
          HF_DATASETS_OFFLINE: "0"
        run: |
          python -m scripts.export_miracl --language en --split dev --max-queries 50 --output "$RUNNER_TEMP/miracl-en-dev"
      - name: Evaluate BM25, BGE-M3 Dense, Hybrid and reranker
        run: |
          python -m scripts.retrieval_quality_benchmark \
            --queries "$RUNNER_TEMP/miracl-en-dev/queries.jsonl" \
            --corpus "$RUNNER_TEMP/miracl-en-dev/corpus.jsonl" \
            --qrels "$RUNNER_TEMP/miracl-en-dev/qrels.jsonl" \
            --candidate-k 20 --top-k 10 \
            --output reports/bge_m3/miracl-en-dev-metrics.json
      - name: Upload official model evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-bge-m3-evaluation
          path: reports/bge_m3/
          if-no-files-found: warn
