name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evidencepilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d evidencepilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EVIDENCEPILOT_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/evidencepilot_test
      DATABASE_URL: sqlite://
      ENVIRONMENT: test
      AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-frontend.txt
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install application and test dependencies
        run: |
          python -m pip install -r requirements-runtime.txt -r requirements-frontend.txt
          python -m pip install pytest pytest-asyncio
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          python -c "import yaml; yaml.safe_load(open('docker-compose.yml', encoding='utf-8'))"
          docker compose --profile apps config --quiet
      - name: Apply Alembic baseline to PostgreSQL
        run: DATABASE_URL="$EVIDENCEPILOT_TEST_POSTGRES_URL" alembic upgrade head
      - name: Compile Python modules
        run: python -m compileall -q app frontend tests migrations
      - name: Run test suite
        run: python -m pytest -q
