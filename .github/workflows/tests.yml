name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evidencepilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d evidencepilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EVIDENCEPILOT_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/evidencepilot_test
      EVIDENCEPILOT_TEST_POSTGRES_APP_URL: postgresql+psycopg://evidencepilot_app:evidencepilot_app_test_password@localhost:5432/evidencepilot_test
      EVIDENCEPILOT_TEST_POSTGRES_DISPATCHER_URL: postgresql+psycopg://evidencepilot_dispatcher:evidencepilot_dispatcher_test_password@localhost:5432/evidencepilot_test
      EVIDENCEPILOT_APP_PASSWORD: evidencepilot_app_test_password
      EVIDENCEPILOT_DISPATCHER_PASSWORD: evidencepilot_dispatcher_test_password
      DATABASE_URL: sqlite://
      ENVIRONMENT: test
      AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-frontend.txt
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install application and test dependencies
        run: |
          python -m pip install -r requirements-runtime.txt -r requirements-frontend.txt
          python -m pip install pytest pytest-asyncio
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          python -c "import yaml; yaml.safe_load(open('docker-compose.yml', encoding='utf-8'))"
          docker compose --profile apps config --quiet
      - name: Bootstrap least-privilege PostgreSQL roles
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/evidencepilot_test" \
            -v ON_ERROR_STOP=1 \
            -v app_password="$EVIDENCEPILOT_APP_PASSWORD" \
            -v dispatcher_password="$EVIDENCEPILOT_DISPATCHER_PASSWORD" \
            -f deploy/postgres/bootstrap_roles.sql
      - name: Apply Alembic migrations and forced RLS policies
        run: DATABASE_URL="$EVIDENCEPILOT_TEST_POSTGRES_URL" alembic upgrade head
      - name: Grant least-privilege runtime table access
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/evidencepilot_test" \
            -v ON_ERROR_STOP=1 -v migration_role=postgres \
            -f deploy/postgres/grant_runtime.sql
      - name: Compile Python modules
        run: python -m compileall -q app frontend tests migrations
      - name: Run test suite
        run: python -m pytest -q
